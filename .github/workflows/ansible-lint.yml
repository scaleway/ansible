name: ansible-lint
on:
  pull_request:
jobs:
  build:
    name: Ansible Lint # Naming the build is important to use it as a status check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run ansible-lint
        uses: ansible/ansible-lint@ef14ce6b520f5da2bde30c6966a7af38d0cbe5a0 # v24.9.0
        # optional (see below):
        with:
          args: "--exclude=.github"
          setup_python: "true"
          working_directory: ""
          requirements_file: ""
